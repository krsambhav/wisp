name: Wisp
options:
  bundleIdPrefix: app.wisp
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    DEAD_CODE_STRIPPING: YES
    ENABLE_HARDENED_RUNTIME: YES
    # Ad-hoc signing keeps the project buildable on any Mac. For local testing of
    # notifications (macOS refuses UNUserNotificationCenter for ad-hoc apps), re-sign
    # the built app with scripts/sign-dev.sh, or set your own identity/team here.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    # The Xcode 16+ debug-dylib stub confuses usernoted's identity check; keep one real executable.
    ENABLE_DEBUG_DYLIB: NO
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      SWIFT_COMPILATION_MODE: wholemodule
targets:
  Wisp:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Shared
      - path: Resources
        excludes:
          - "Info.plist"
          - "Wisp.entitlements"
          - "Fonts"
      - path: Resources/Fonts
        type: folder
    info:
      path: Resources/Info.plist
      properties:
        CFBundleName: Wisp
        CFBundleDisplayName: Wisp
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "3"
        CFBundleIdentifier: app.wisp.desktop
        LSMinimumSystemVersion: "14.0"
        LSApplicationCategoryType: public.app-category.social-networking
        NSPrincipalClass: NSApplication
        NSHumanReadableCopyright: "© 2026 Wisp contributors. WhatsApp is a trademark of WhatsApp LLC; Wisp is an independent client shell."
        NSMicrophoneUsageDescription: "Wisp needs the microphone so you can record voice messages and make calls in WhatsApp."
        NSCameraUsageDescription: "Wisp needs the camera so you can take photos and make video calls in WhatsApp."
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
        LSUIElement: false
        CFBundleIconName: AppIcon
        ATSApplicationFontsPath: Fonts
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
    entitlements:
      path: Resources/Wisp.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.device.audio-input: true
        com.apple.security.device.camera: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.downloads.read-write: true
        com.apple.security.print: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.wisp.desktop
        PRODUCT_NAME: Wisp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        COMBINE_HIDPI_IMAGES: YES
        OTHER_SWIFT_FLAGS: "$(inherited)"
    dependencies:
      - target: WispUpdateHelper
        embed: true
  # Unsandboxed XPC service used by the in-app updater (see Helper/main.swift).
  # Signed separately by scripts/sign-dev.sh and scripts/package-release.sh so it
  # never inherits the app's sandbox entitlement.
  WispUpdateHelper:
    type: xpc-service
    platform: macOS
    sources:
      - path: Helper
      - path: Shared
    info:
      path: Helper/Info.plist
      properties:
        CFBundleName: WispUpdateHelper
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "3"
        XPCService:
          ServiceType: Application
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.wisp.desktop.UpdateHelper
        PRODUCT_NAME: WispUpdateHelper
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        SKIP_INSTALL: YES
  WispTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: Wisp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.wisp.desktop.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
schemes:
  Wisp:
    build:
      targets:
        Wisp: all
        WispTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [WispTests]
    archive:
      config: Release
